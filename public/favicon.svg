<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gold-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#F5D075"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B38622"/>
      <stop offset="100%" stop-color="#73520E"/>
    </linearGradient>
    <linearGradient id="gold-facet-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEA"/>
      <stop offset="40%" stop-color="#FCE195"/>
      <stop offset="100%" stop-color="#C59B33"/>
    </linearGradient>
    <linearGradient id="gold-facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89E38"/>
      <stop offset="60%" stop-color="#916919"/>
      <stop offset="100%" stop-color="#5B4009"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Dark Matte Background -->
  <rect width="512" height="512" rx="128" fill="#0C0E12"/>
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.25"/>
  
  <!-- Emblem Group -->
  <g filter="url(#gold-glow)" transform="translate(4, 0)">
    <!-- Top Chevron Wing -->
    <path d="M 230 110 L 335 110 L 275 180 L 170 180 Z" fill="url(#gold-facet-light)" />
    <path d="M 335 110 L 350 120 L 290 190 L 275 180 Z" fill="url(#gold-facet-dark)" />
    
    <!-- Middle Chevron Wing -->
    <path d="M 205 205 L 295 205 L 245 265 L 155 265 Z" fill="url(#gold-base)" />
    <path d="M 295 205 L 310 215 L 260 275 L 245 265 Z" fill="url(#gold-facet-dark)" />

    <!-- Left Angular Spine -->
    <path d="M 170 180 L 205 205 L 155 265 L 155 350 L 120 395 L 120 240 Z" fill="url(#gold-facet-dark)" />
    <path d="M 170 180 L 155 265 L 120 240 Z" fill="url(#gold-facet-light)" />
    <path d="M 155 350 L 195 350 L 160 395 L 120 395 Z" fill="url(#gold-base)" />
  </g>
</svg>
